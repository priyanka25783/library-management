server.port=${PORT:8080}

# Database: Railway MySQL variables, falling back to local MySQL
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:librarydb}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:${DB_PASSWORD:}}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Admin login (override with environment variables!)
admin.username=${ADMIN_USER:admin}
admin.password=${ADMIN_PASSWORD:admin123}

# Fine per overdue day
fine.per-day=${FINE_PER_DAY:5}
